<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كليبو</title>
<style>
:root{--bg:#13151a;--sf:#1e2128;--gold:#c9a96a;--ink:#f3efe6;--mut:#9a9588;--line:#343841}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{position:relative;height:100%;scroll-snap-align:start;display:flex;justify-content:center;background:#000}
.card video{height:100%;width:100%;max-width:480px;object-fit:cover}
.info{position:absolute;bottom:24px;right:calc(50% - 232px);padding:0 16px;max-width:380px;text-shadow:0 1px 6px #000}
.side{position:absolute;bottom:90px;left:calc(50% - 232px);padding:0 12px;text-align:center}
.side button{background:#13151acc;border:1px solid var(--line);color:var(--ink);width:50px;height:50px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.side small{display:block;margin:2px 0 14px;font-size:.8rem}
@media(max-width:500px){.info{right:0}.side{left:0}}
header{position:fixed;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:5;background:linear-gradient(#000a,transparent)}
header h1{font-size:1.3rem;color:var(--gold);letter-spacing:.5px}
.nav{display:flex;gap:8px}
button.b{background:var(--gold);color:#1a1608;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(92vw,440px);background:var(--sf);color:var(--ink);max-height:86vh}
dialog::backdrop{background:#000b}
dialog input,dialog select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
dialog h3{color:var(--gold);margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}
.it{padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--mut)}
.it a{color:var(--gold)}.bal{font-size:2rem;color:var(--gold);margin:6px 0}
.empty{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<header><h1>كليبو</h1><div class="nav" id="nav"></div></header>
<main id="feed"></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,prof=null;
const open=h=>{$('dlg').innerHTML=h+'<div class="row"><button class="g" onclick="dlg.close()">إغلاق</button></div>';$('dlg').showModal()};
const fail=e=>alert(e.message||e);
async function init(){const{data:{session}}=await sb.auth.getSession();me=session?.user||null;prof=null;
 if(me){const{data}=await sb.from('profiles').select('*').eq('id',me.id).single();prof=data}
 $('nav').innerHTML=me?`<button class="g" onclick="wallet()">المحفظة ${prof?prof.coins:0}</button><button class="b" onclick="upl()">رفع</button><button class="g" onclick="out()">خروج</button>`:`<button class="b" onclick="auth()">دخول</button>`;
 feed()}
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.7});
async function feed(){const{data,error}=await sb.from('videos').select('*').eq('status','published').order('created_at',{ascending:false}).limit(50);
 const f=$('feed');f.innerHTML='';
 if(error||!data.length){f.innerHTML='<div class="empty">'+(error?'تعذر الاتصال بـ Supabase. راجع config.js':'لا توجد فيديوهات بعد. كن أول من ينشر.')+'</div>';return}
 data.forEach(v=>{const s=document.createElement('section');s.className='card';
  s.innerHTML=`<video src="${esc(v.url)}" loop muted playsinline></video><div class="info"><b>@${esc(v.username)} ${v.verified?'<span style="color:var(--gold)" title="حساب موثّق">✔</span>':''}</b><br><span>${esc(v.title)}</span></div>
  <div class="side"><button aria-label="إعجاب">♥</button><small>${v.likes}</small></div>`;
  const vd=s.querySelector('video');vd.onclick=()=>vd.muted=!vd.muted;
  s.querySelector('button').onclick=async e=>{const{error}=await sb.rpc('like_video',{v:v.id});if(!error){v.likes++;e.target.nextElementSibling.textContent=v.likes}};
  f.appendChild(s);io.observe(s)})}
function auth(){open(`<h3>الدخول أو إنشاء حساب</h3><input id="e" type="email" placeholder="name@mail.com" dir="ltr"><input id="p" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><input id="u" placeholder="اسم المستخدم (للتسجيل فقط)">
 <div class="row"><button class="b" onclick="login()">دخول</button><button class="g" onclick="signup()">إنشاء حساب</button></div>`)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('e').value,password:$('p').value});if(error)return fail(error);dlg.close();init()}
async function signup(){const{error}=await sb.auth.signUp({email:$('e').value,password:$('p').value,options:{data:{username:$('u').value.trim()}}});if(error)return fail(error);alert('تم إنشاء الحساب. إن طُلب تأكيد البريد فتحقق من بريدك ثم سجّل الدخول.');dlg.close();init()}
async function out(){await sb.auth.signOut();init()}
function upl(){open(`<h3>رفع فيديو</h3><input id="t" placeholder="عنوان الفيديو"><input id="f" type="file" accept="video/mp4,video/webm"><div class="row"><button class="b" id="ub" onclick="doUpl()">نشر</button></div>`)}
async function doUpl(){const f=$('f').files[0];if(!f)return fail('اختر ملف فيديو');if(f.size>50*1024*1024)return fail('الحجم الأقصى 50 ميجابايت');
 $('ub').textContent='جارٍ الرفع…';const p=me.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');
 const{error}=await sb.storage.from('videos').upload(p,f);if(error){$('ub').textContent='نشر';return fail(error)}
 const url=sb.storage.from('videos').getPublicUrl(p).data.publicUrl;
 const r=await sb.from('videos').insert({title:$('t').value.trim()||'بدون عنوان',url});if(r.error)return fail(r.error);dlg.close();feed()}
const st={pending:'قيد المراجعة',link_sent:'الرابط جاهز',paid:'مكتمل',rejected:'مرفوض'};
async function wallet(){await init0();const[t,w]=await Promise.all([sb.from('topups').select('*').order('id',{ascending:false}),sb.from('withdrawals').select('*').order('id',{ascending:false})]);
 const vs={none:'<button class="b" onclick="ver()">طلب توثيق الحساب</button>',pending:'<span class="it">طلب التوثيق قيد المراجعة</span>',approved:'<span style="color:var(--gold)">✔ حسابك موثّق</span>',rejected:'<button class="g" onclick="ver()">أعد طلب التوثيق</button>'}[prof.verify_status];
 open(`<h3>المحفظة</h3><div class="bal">${prof.coins} عملة</div>${vs}
 <h3 style="margin-top:14px">إيداع (شحن)</h3><input id="ta" type="number" min="1" placeholder="عدد العملات"><button class="b" onclick="top()">طلب شحن</button>
 ${(t.data||[]).map(x=>`<div class="it">شحن ${x.amount} — ${st[x.status]} ${x.pay_link&&x.status!=='paid'?`<a href="${esc(x.pay_link)}" target="_blank" rel="noopener">ادفع الآن</a>`:''}</div>`).join('')}
 <h3 style="margin-top:14px">سحب</h3><input id="wa" type="number" min="1" placeholder="عدد العملات"><input id="wm" placeholder="طريقة الاستلام (رقم محفظة أو حساب)"><button class="b" onclick="wd()">طلب سحب</button>
 ${(w.data||[]).map(x=>`<div class="it">سحب ${x.amount} — ${st[x.status]}</div>`).join('')}`)}
async function init0(){const{data}=await sb.from('profiles').select('*').eq('id',me.id).single();prof=data}
async function ver(){const{error}=await sb.rpc('request_verify');if(error)return fail(error);wallet()}
async function top(){const a=+$('ta').value;if(a<1)return;const{error}=await sb.from('topups').insert({amount:a});if(error)return fail(error);wallet()}
async function wd(){const a=+$('wa').value;if(a<1||!$('wm').value.trim())return fail('أدخل المبلغ وطريقة الاستلام');const{error}=await sb.rpc('request_withdraw',{a,m:$('wm').value.trim()});if(error)return fail(error);init();wallet()}
init();
</script></body></html>
